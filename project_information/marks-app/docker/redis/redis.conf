# =============================================================================
# Redis Configuration — Marks App / EduAI V5
# Handles: Leaderboard Sorted Sets (ZSET), BullMQ Queues, Session Caching
# =============================================================================

port 6379
bind 0.0.0.0
protected-mode yes

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence (AOF + RDB for 99.99% durability during tests)
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 1000

# Client & Connection Limits
maxclients 10000
timeout 300
tcp-keepalive 60

# Logging
loglevel notice
