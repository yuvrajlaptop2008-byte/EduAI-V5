# =============================================================================
# NGINX Reverse Proxy & API Gateway — Marks App
# Routes: Frontend SPA, Node Backend API, Payload CMS, Appsmith Operations
# =============================================================================

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    # 1. Frontend SPA (Vite Dev Server / Static Build)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Backend API
    location /api/ {
        proxy_pass http://backend-api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Payload Headless CMS
    location /cms/ {
        proxy_pass http://payload-cms:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Appsmith Internal Operations Console
    location /ops/ {
        proxy_pass http://appsmith:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Meilisearch Fast Search Proxy
    location /search/ {
        proxy_pass http://meilisearch:7700/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
